<text x="2" y="30" class="n">03 ——</text>
<text x="0" y="74" class="t">The journey</text>
<rect x="0" y="88" width="900" height="3" rx="1.5" fill="url(#g)"/>
<rect class="sh" x="0" y="87" width="160" height="5" rx="2.5" fill="url(#s)" opacity=".7" style="mix-blend-mode:overlay"/>
