<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img" aria-label="SAM Network">
<defs>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  <linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".9"/><stop offset=".35" stop-color="#3B82F6" stop-opacity=".15"/><stop offset=".65" stop-color="#22D3EE" stop-opacity=".15"/><stop offset="1" stop-color="#3B82F6" stop-opacity=".9"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3B82F6" stop-opacity=".45"/><stop offset=".6" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity=".09"/></pattern>
  <clipPath id="c"><rect x="2" y="2" width="616" height="326" rx="24"/></clipPath>
  <style>
    .t{font:800 30px -apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;fill:#F8FAFC;letter-spacing:-.5px}
    .r{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;fill:#22D3EE}
    .d{font:400 17.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif;fill:#A9B4C6}
    .tg{font:600 13.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#E2E8F0}
    .st{font:700 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:1.5px;fill:#22D3EE}
    .gl{animation:breathe 5s ease-in-out infinite} @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
    .dt{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
    .ic{animation:float 4s ease-in-out infinite} @keyframes float{0%,100%{transform:translate(78px,74px)}50%{transform:translate(78px,69px)}}
  </style>
</defs>
<g clip-path="url(#c)">
  <rect width="620" height="330" fill="#0B1222"/>
  <rect width="620" height="330" fill="url(#dots)"/>
  <rect class="gl" width="620" height="330" fill="url(#glow)"/>
</g>
<rect x="2" y="2" width="616" height="326" rx="24" fill="none" stroke="url(#bd)" stroke-width="2.5"/>
<g class="ic" transform="translate(78 74)">
  <rect x="-34" y="-34" width="68" height="68" rx="18" fill="url(#a)"/>
  <rect x="-34" y="-34" width="68" height="34" rx="18" fill="#fff" fill-opacity=".12"/>
  <path d="M-14 16V-14h18v30M4 16V-4h12v20M-20 16h42" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M-9-8h3m3 0h3M-9-1h3m3 0h3M-9 6h3m3 0h3M8 2h4M8 8h4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</g>
<rect x="464" y="40" width="112" height="28" rx="14" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".4"/>
<circle class="dt" cx="480" cy="54" r="4" fill="#22D3EE"/>
<text x="490" y="58.5" class="st">LAUNCHING</text>
<text x="44" y="146" class="t">SAM Network</text>
<text x="44" y="173" class="r">Tech Lead · ~20-person team</text>
<text x="44" y="204" class="d"><tspan x="44" dy="0">One platform for the entire buildings</tspan><tspan x="44" dy="25">ecosystem — FMS, BMS, strata, incidents</tspan><tspan x="44" dy="25">and maintenance in a single SaaS.</tspan></text>
<rect x="44" y="268" width="114" height="30" rx="15" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text x="101" y="288" class="tg" text-anchor="middle">TypeScript</text><rect x="168.0" y="268" width="56" height="30" rx="15" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text x="196" y="288" class="tg" text-anchor="middle">Java</text><rect x="234.4" y="268" width="56" height="30" rx="15" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text x="263" y="288" class="tg" text-anchor="middle">SaaS</text><rect x="300.8" y="268" width="133" height="30" rx="15" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text x="367" y="288" class="tg" text-anchor="middle">Multi-tenant</text>
</svg>
