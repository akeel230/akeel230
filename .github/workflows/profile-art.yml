name: Profile art

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/profile-art.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#6366F1&color_dots=#ebedf0,#a5f3fc,#67e8f9,#22d3ee,#0891b2
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161b22,#164e63,#0e7490,#06b6d4,#67e8f9
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Update 3D contribution graph"
          git pull --rebase origin master && git push
